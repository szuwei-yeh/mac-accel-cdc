   <g id="text_1">
    <text style="fill: #182c43; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="30.24" y="37.757031" transform="rotate(-0 30.24 37.757031)">Timing optimization | move address arithmetic off the AR output</text>
   </g>
   <g id="text_2">
    <text style="fill: #52677e; font: 11px 'DejaVu Sans'; text-anchor: start" x="30.24" y="59.042344" transform="rotate(-0 30.24 59.042344)">Design Compiler pre-layout block benchmark: mac_dma_rob  /  depth 8  /  10 ns target  /  OSU 0.18 um</text>
   </g>
   <g id="text_3">
    <text style="fill: #52677e; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="46.8" y="105.995313" transform="rotate(-0 46.8 105.995313)">BEFORE  /  COMBINATIONAL ADDRESS</text>
   </g>
   <g id="text_4">
    <text style="fill: #2563a7; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="522" y="105.995313" transform="rotate(-0 522 105.995313)">AFTER  /  HANDSHAKE-DRIVEN ADDRESS STATE</text>
   </g>
   <g id="text_5">
    <text style="fill: #182c43; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="46.8" y="137.784375" transform="rotate(-0 46.8 137.784375)">cmd_addr_r + (issue_elem &lt;&lt; 2)  -&gt;  ARADDR</text>
   </g>
   <g id="text_6">
    <text style="fill: #52677e; font: 11px 'DejaVu Sans'; text-anchor: start" x="46.8" y="170.795313" transform="rotate(-0 46.8 170.795313)">AR output includes a long address carry chain.</text>
   </g>
   <g id="text_7">
    <text style="fill: #182c43; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="522" y="135.166406" transform="rotate(-0 522 135.166406)">current_ar_addr_r  -&gt;  ARADDR</text>
   </g>
   <g id="text_8">
    <text style="fill: #2563a7; font: 11px 'DejaVu Sans'; text-anchor: start" x="522" y="161.282344" transform="rotate(-0 522 161.282344)">On ARVALID &amp;&amp; ARREADY: addr += burst_bytes</text>
   </g>
   <g id="text_9">
    <text style="fill: #52677e; font: 10px 'DejaVu Sans'; text-anchor: start" x="522" y="182.759375" transform="rotate(-0 522 182.759375)">Address stays stable while the AR channel is stalled.</text>
   </g>
   <g id="text_10">
    <text style="fill: #2563a7; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="46.8" y="227.890938" transform="rotate(-0 46.8 227.890938)">26.36% shorter QoR critical path</text>
   </g>
   <g id="text_11">
    <text style="fill: #2563a7; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="570.24" y="227.824531" transform="rotate(-0 570.24 227.824531)">31 -&gt; 11 logic levels</text>
   </g>
   <g id="text_12">
    <text style="fill: #2563a7; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="47.52" y="523.274844" transform="rotate(-0 47.52 523.274844)">Setup slack @ 100 MHz: +3.5027 ns  -&gt;  +4.7923 ns     |     ARADDR leaves the global top 10</text>
   </g>
   <g id="text_13">
    <text style="fill: #52677e; font: 10px 'DejaVu Sans'; text-anchor: start" x="30.24" y="570.839375" transform="rotate(-0 30.24 570.839375)">The global worst path changes from ARADDR to reset/control. These bars compare overall QoR, not the same path.</text>
   </g>
   <g id="text_14">
    <text style="fill: #52677e; font: 10px 'DejaVu Sans'; text-anchor: start" x="30.24" y="593.879375" transform="rotate(-0 30.24 593.879375)">Source: syn/README.md, first synthesis-driven optimization. Ideal clocks; no extracted parasitics or physical closure.</text>
   </g>
  </g>

   <g id="text_1">
    <text style="fill: #182c43; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="30.24" y="37.757031" transform="rotate(-0 30.24 37.757031)">Targeted clock gating | reduce switching in the A-operand buffer</text>
   </g>
   <g id="text_2">
    <text style="fill: #52677e; font: 11px 'DejaVu Sans'; text-anchor: start" x="30.24" y="59.042344" transform="rotate(-0 30.24 59.042344)">SAIF-driven pre-layout block power: mac_dma_rob  /  depth 8  /  100 MHz  /  identical activity files</text>
   </g>
   <g id="text_3">
    <text style="fill: #087e83; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="46.8" y="107.435313" transform="rotate(-0 46.8 107.435313)">GATING SCOPE</text>
   </g>
   <g id="text_4">
    <text style="fill: #182c43; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="129.6" y="138.864375" transform="rotate(-0 129.6 138.864375)">buf_a only</text>
   </g>
   <g id="text_5">
    <text style="fill: #52677e; font: 9px 'DejaVu Sans'; text-anchor: middle" x="129.6" y="160.523438" transform="rotate(-0 129.6 160.523438)">4096 register bits</text>
   </g>
   <g id="text_6">
    <text style="fill: #182c43; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="367.2" y="139.03125" transform="rotate(-0 367.2 139.03125)">256 independent banks</text>
   </g>
   <g id="text_7">
    <text style="fill: #52677e; font: 9px 'DejaVu Sans'; text-anchor: middle" x="367.2" y="160.523438" transform="rotate(-0 367.2 160.523438)">16 bits per bank</text>
   </g>
   <g id="text_8">
    <text style="fill: #182c43; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="518.4" y="135.024375" transform="rotate(-0 518.4 135.024375)">Per bank: discrete LATCH + AND clock gate</text>
   </g>
   <g id="text_9">
    <text style="fill: #52677e; font: 11px 'DejaVu Sans'; text-anchor: start" x="518.4" y="159.995313" transform="rotate(-0 518.4 159.995313)">ROB, control, FIFO and synchronizers are excluded.</text>
   </g>
   <g id="text_10">
    <text style="fill: #087e83; font: 700 24px 'DejaVu Sans'; text-anchor: start" x="80.64" y="231.2625" transform="rotate(-0 80.64 231.2625)">-53.59%</text>
   </g>
   <g id="text_11">
    <text style="fill: #087e83; font: 700 24px 'DejaVu Sans'; text-anchor: start" x="570.24" y="231.2625" transform="rotate(-0 570.24 231.2625)">-57.22%</text>
   </g>
   <g id="text_12">
    <text style="fill: #087e83; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="46.8" y="548.019063" transform="rotate(-0 46.8 548.019063)">Energy per measured job: 221.870 nJ  -&gt;  102.970 nJ    |    53.59% reduction</text>
   </g>
   <g id="text_13">
    <text style="fill: #52677e; font: 10px 'DejaVu Sans'; text-anchor: start" x="30.24" y="597.340313" transform="rotate(-0 30.24 597.340313)">Same deterministic workload and active/idle SAIF windows; all 4096 buf_a bits annotated in both designs.</text>
   </g>
   <g id="text_14">
    <text style="fill: #52677e; font: 10px 'DejaVu Sans'; text-anchor: start" x="30.24" y="621.100313" transform="rotate(-0 30.24 621.100313)">Source: syn/README.md, targeted buf_a experiment. Discrete latch/logic gates; no production ICG, CTS or post-layout power.</text>
   </g>
  </g>

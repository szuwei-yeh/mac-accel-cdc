  <g id="text_27">
   <text style="font: 11px 'DejaVu Sans'" transform="translate(80.64 88.07225)">buf_a: 256 × 16-bit storage entries (4,096 bits).</text>
   <text style="font: 11px 'DejaVu Sans'" transform="translate(80.64 104.039094)">Word-level discrete LATCH + AND gating; no dedicated ICG.</text>
   <text style="font: 11px 'DejaVu Sans'" transform="translate(80.64 119.7)">ROB, control, FIFO, MAC and CDC outside the gating scope.</text>
